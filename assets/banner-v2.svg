<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skillselion MCP">
  <rect width="1200" height="340" fill="#f7f5ef"/>
  <!-- hairline frame + accent baseline (Paper / Swiss: flat, sharp corners) -->
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#e7e2d6"/>
  <rect x="0" y="334" width="1200" height="6" fill="#0891b2"/>
  <!-- faint dot grid -->
  <g fill="#0891b2" opacity="0.12">
    <circle cx="1040" cy="64" r="3.5"/><circle cx="1080" cy="64" r="3.5"/><circle cx="1120" cy="64" r="3.5"/><circle cx="1160" cy="64" r="3.5"/>
    <circle cx="1040" cy="104" r="3.5"/><circle cx="1080" cy="104" r="3.5"/><circle cx="1120" cy="104" r="3.5"/><circle cx="1160" cy="104" r="3.5"/>
    <circle cx="1040" cy="144" r="3.5"/><circle cx="1080" cy="144" r="3.5"/><circle cx="1120" cy="144" r="3.5"/><circle cx="1160" cy="144" r="3.5"/>
  </g>

  <!-- brand mark: the hairline S monogram with the accent terminal dot -->
  <g transform="translate(74,104) scale(5.4)">
    <path d="M15.5 6 H10.5 a3 3 0 0 0 0 6 H13.5 a3 3 0 0 1 0 6 H8"
      stroke="#5b554c" stroke-width="2.7" stroke-linecap="round" fill="none"/>
    <circle cx="15.5" cy="6" r="1.6" fill="#0891b2"/>
  </g>

  <!-- wordmark -->
  <text x="230" y="150" font-family="'Space Grotesk',system-ui,'Segoe UI',sans-serif" font-size="62" font-weight="700" fill="#5b554c" letter-spacing="-1">Skillselion <tspan fill="#0891b2">MCP</tspan></text>
  <text x="232" y="196" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="19" fill="#797064">Search thousands of skills, MCP servers &amp; marketplaces — from your editor.</text>

  <!-- compatibility pills -->
  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="18" font-weight="600">
    <g transform="translate(232,232)">
      <rect width="160" height="40" fill="#ffffff" stroke="#d8d2c4"/>
      <text x="80" y="26" fill="#5b554c" text-anchor="middle">Claude Code</text>
    </g>
    <g transform="translate(404,232)">
      <rect width="100" height="40" fill="#ffffff" stroke="#d8d2c4"/>
      <text x="50" y="26" fill="#5b554c" text-anchor="middle">Cursor</text>
    </g>
    <g transform="translate(516,232)">
      <rect width="92" height="40" fill="#ffffff" stroke="#d8d2c4"/>
      <text x="46" y="26" fill="#5b554c" text-anchor="middle">Codex</text>
    </g>
    <g transform="translate(620,232)">
      <rect width="190" height="40" fill="#ffffff" stroke="#d8d2c4"/>
      <text x="95" y="26" fill="#5b554c" text-anchor="middle">Claude Desktop</text>
    </g>
    <g transform="translate(822,232)">
      <rect width="150" height="40" fill="#0891b2"/>
      <text x="75" y="26" fill="#f7f5ef" text-anchor="middle">+ any MCP</text>
    </g>
  </g>
</svg>
